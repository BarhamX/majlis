name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/**

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore backend dependencies
        run: dotnet restore src/backend/Majlis.sln

      - name: Build backend
        run: dotnet build src/backend/Majlis.sln --configuration Release --no-restore

      - name: Verify hosted Linux Docker engine
        run: docker info

      - name: Run identity PostgreSQL baseline
        run: >-
          dotnet test src/backend/Majlis.Tests/Majlis.Tests.csproj
          --configuration Release
          --no-build
          --filter "FullyQualifiedName~IdentityProfilePostgreSqlTests"
          --logger "trx;LogFileName=identity-postgresql.trx"
          --results-directory TestResults

      - name: Run full backend test suite
        run: >-
          dotnet test src/backend/Majlis.sln
          --configuration Release
          --no-build
          --logger "trx;LogFileName=backend-full.trx"
          --results-directory TestResults

      - name: Upload failed test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
