name: majlis

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: majlis
      POSTGRES_USER: majlis
      POSTGRES_PASSWORD: ${MAJLIS_DB_PASSWORD:-majlis-dev}
    ports:
      - "5432:5432"
    volumes:
      - majlis-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U majlis -d majlis"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  majlis-postgres-data:
